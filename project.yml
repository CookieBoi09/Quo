name: Quo
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    QUO_APP_GROUP: group.com.example.Quo
    VERSIONING_SYSTEM: apple-generic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  Quo:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Quo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Quo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_QuoAppGroup: $(QUO_APP_GROUP)
    entitlements:
      path: App/Quo.entitlements
      properties:
        com.apple.security.application-groups: [$(QUO_APP_GROUP)]
    dependencies:
      - target: QuoWidgets
  QuoWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Quo.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Quo Widgets
        QuoAppGroup: $(QUO_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/QuoWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(QUO_APP_GROUP)]
  QuoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Quo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Quo:
    build:
      targets:
        Quo: all
        QuoWidgets: all
    test:
      targets: [QuoTests]
